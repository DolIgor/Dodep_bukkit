name: DodepPlugin
version: 1.0.0
main: ru.dodep.DodepPlugin
api-version: '1.20'
author: ChatGPT
description: DonationAlerts webhook rewards for casino chips
commands:
  dodeptest:
    description: Manual test donation processing
    usage: /dodeptest <player> <amount>
    permission: dodep.test
  dodepstatus:
    description: Shows plugin status and webhook endpoint
    usage: /dodepstatus
    permission: dodep.status
  dodepreload:
    description: Reload config and restart embedded webhook server
    usage: /dodepreload
    permission: dodep.reload
permissions:
  dodep.test:
    description: Allows running /dodeptest
    default: op
  dodep.status:
    description: Allows running /dodepstatus
    default: op
  dodep.reload:
    description: Allows running /dodepreload
    default: op
